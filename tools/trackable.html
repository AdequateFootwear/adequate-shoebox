<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>{{TITLE}} · Adequate's Shoebox</title>
<meta name="description" content="{{DESCRIPTION}}">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231D4D30'/%3E%3Cpath d='M16 4l4.5 12L16 28l-4.5-12z' fill='%23F4F2E8'/%3E%3Cpath d='M16 4l4.5 12h-9z' fill='%23E8BE66'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
{{STYLE}}
</style>
</head>
<body>
<header class="band">
{{TOPO}}
  <div class="band-in">
    <div class="suite">
      <a class="who" href="../"><svg class="mark" viewBox="0 0 32 32" aria-hidden="true" focusable="false"><circle cx="16" cy="16" r="14.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M16 4.5l4.2 11.5L16 27.5 11.8 16z" fill="currentColor" opacity=".55"/><path d="M16 4.5l4.2 11.5h-8.4z" fill="var(--band-hl)"/></svg><span>Adequate's Shoebox</span></a>
      <span class="by">{{GROUP}}</span>
    </div>
    <div class="brand">
      <h1 class="name">{{NAME}}</h1>
      <p class="stats">{{SUBLINE}}</p>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="tbgrid">
    <section class="gallery" aria-label="Photos">
{{GALLERY}}
    </section>
    <section class="facts" aria-label="About this trackable">
{{FACTS}}
    </section>
  </div>
{{CHECKLIST}}
  <nav class="prevnext" aria-label="Other trackables">
{{PREVNEXT}}
  </nav>
  <footer>
    <span>Built from Adequate's collection sheet, as read on {{READ}}.</span>
    <span>Log it on its page at geocaching.com once your mission is done.</span>
  </footer>
</main>
<div class="toast" id="toast" role="status"></div>

<script>
(function(){
  'use strict';
  var toast = document.getElementById('toast'), timer;
  function say(msg){
    toast.textContent = msg; toast.classList.add('on');
    clearTimeout(timer); timer = setTimeout(function(){ toast.classList.remove('on'); }, 1600);
  }
  var main = document.getElementById('ph-main');
  document.addEventListener('click', function(e){
    var t = e.target.closest ? e.target.closest('.thumbs a') : null;
    if (t && main) {
      e.preventDefault();
      main.src = t.getAttribute('href');
      main.width = +t.getAttribute('data-w'); main.height = +t.getAttribute('data-h');
      Array.prototype.forEach.call(document.querySelectorAll('.thumbs a'), function(a){ a.setAttribute('aria-current', a === t ? 'true' : 'false'); });
      return;
    }
    var b = e.target.closest ? e.target.closest('button.copy') : null;
    if (!b) return;
    var code = b.getAttribute('data-code');
    function fallback(){
      var el = b.parentNode.querySelector('.code');
      var r = document.createRange(); r.selectNodeContents(el);
      var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
      say('Selected: copy it from your menu');
    }
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(code).then(function(){ say('Copied ' + code); }, fallback);
    } else { fallback(); }
  });

  // ---------- mission checklist: ticks are the cacher's; a log only ever lights items, never fails one ----------
  var ck = document.getElementById('checklist');
  if (ck) (function(){
    var KEY = 'shoebox.checklist.' + ck.getAttribute('data-tb'), sig = ck.getAttribute('data-sig');
    var items = Array.prototype.slice.call(ck.querySelectorAll('li.ck'));
    var rems = Array.prototype.slice.call(ck.querySelectorAll('li.rem'));  // reminders: they light, but have no box
    var log = document.getElementById('ck-log'), wordsOut = document.getElementById('ck-words');
    var sum = document.getElementById('ck-sum'), file = document.getElementById('ck-file');
    var yours = document.getElementById('ck-yours'), urls = [], was = [], off = [];  // off: the cacher unticked it
    function norm(s){
      return s.normalize('NFKD').replace(/[\u0300-\u036f]/g, '').toLowerCase()
              .replace(/[\u2018\u2019\u02bc\u2032]/g, "'").replace(/[\u2010-\u2015\u2212]/g, '-');
    }
    function esc(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
    var LETTER = '[\\p{L}\\p{N}]', GC = /(?:^|[^a-z0-9])(gc[0-9a-z]{2,7})(?![a-z0-9])/g;
    function codes(text){  // how many different GC codes the log holds
      var seen = {}, m; GC.lastIndex = 0;
      while ((m = GC.exec(text))) seen[m[1]] = 1;
      return Object.keys(seen).length;
    }
    items.concat(rems).forEach(function(li){
      var m = li.getAttribute('data-mentions');
      li._re = m ? JSON.parse(m).map(function(w){
        return new RegExp('(^|[^\\p{L}\\p{N}])' + esc(norm(w).trim()).replace(/\s+/g, '\\s+') + '(?!' + LETTER + ')', 'u');
      }) : null;
      li._box = li.querySelector('input');
    });
    function light(li, on){
      var chip = li.querySelector('.chip.lit');
      if (chip) chip.hidden = !on;
      li.classList.toggle('lit', on);
    }
    function lit(li, text, words){
      var any = false;
      if (li.hasAttribute('data-gc')) { if (codes(text) < +li.getAttribute('data-gc')) return false; any = true; }
      if (li.hasAttribute('data-words')) { if (words < +li.getAttribute('data-words')) return false; any = true; }
      if (li._re) { if (!li._re.some(function(r){ return r.test(text); })) return false; any = true; }
      return any;
    }
    function load(){ try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } }
    function save(){
      try {
        localStorage.setItem(KEY, JSON.stringify({ sig: sig, log: log.value,
          ticks: items.map(function(li){ return li._box.checked ? 1 : 0; }),
          off: items.map(function(li, i){ return off[i] ? 1 : 0; }) }));
      } catch (e) {}
    }
    function tally(){
      var n = { req: [0, 0], bonus: [0, 0], alt: [0, 0] };
      items.forEach(function(li){
        var k = li.classList.contains('bonus') ? 'bonus' : li.classList.contains('alt') ? 'alt' : 'req';
        n[k][1]++; if (li._box.checked) n[k][0]++;
        li.classList.toggle('done', li._box.checked);
      });
      sum.textContent = n.req[0] + ' of ' + n.req[1] + ' ticked'
        + (n.bonus[1] ? ' · bonus ' + n.bonus[0] + ' of ' + n.bonus[1] : '')
        + (n.alt[1] ? ' · alternate ' + n.alt[0] + ' of ' + n.alt[1] : '');
    }
    function check(first){
      var text = norm(log.value), words = (text.match(/[\p{L}\p{N}]+(?:['-][\p{L}\p{N}]+)*/gu) || []).length;
      wordsOut.textContent = words + (words === 1 ? ' word' : ' words');
      rems.forEach(function(li){ light(li, lit(li, text, words)); });
      items.forEach(function(li, i){
        var on = lit(li, text, words);
        light(li, on);
        // it lights up and ticks, never unticks, and never re-ticks a box the cacher unticked
        if (on && !was[i] && !first && !off[i]) li._box.checked = true;
        was[i] = on;
      });
      tally();
    }
    var st = load();
    if (typeof st.log === 'string') log.value = st.log;
    if (st.sig === sig && st.ticks) items.forEach(function(li, i){
      li._box.checked = !!st.ticks[i]; off[i] = !!(st.off && st.off[i]);
    });
    check(true);
    log.addEventListener('input', function(){ check(false); save(); });
    ck.addEventListener('change', function(e){
      if (e.target.type !== 'checkbox') return;
      off[items.indexOf(e.target.closest('li.ck'))] = !e.target.checked;
      tally(); save();
    });
    function showPhotos(){
      var imgs = urls.map(function(u){ return '<img src="' + u + '" alt="">'; }).join('');
      if (yours) yours.innerHTML = imgs;
      items.forEach(function(li){
        var m = li.querySelector('.mine');
        if (m) { m.innerHTML = imgs; m.hidden = !urls.length; }
      });
    }
    if (file) file.addEventListener('change', function(){
      urls.forEach(URL.revokeObjectURL);
      urls = Array.prototype.slice.call(file.files || []).filter(function(f){ return /^image\//.test(f.type); })
             .map(function(f){ return URL.createObjectURL(f); });
      showPhotos();
    });
    document.getElementById('ck-copy').addEventListener('click', function(){
      if (!log.value.trim()) { say('Nothing to copy yet'); return; }
      function pick(){ log.focus(); log.select(); say('Selected: copy it from your menu'); }
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(log.value).then(function(){ say('Log copied'); }, pick);
      } else { pick(); }
    });
    document.getElementById('ck-clear').addEventListener('click', function(){
      if (!window.confirm('Clear your ticks, log and photos on this page?')) return;
      try { localStorage.removeItem(KEY); } catch (e) {}
      log.value = '';
      items.forEach(function(li){ li._box.checked = false; });
      off = [];
      urls.forEach(URL.revokeObjectURL); urls = [];
      if (file) file.value = '';
      showPhotos(); check(true);
    });
  })();
})();
</script>
</body>
</html>
